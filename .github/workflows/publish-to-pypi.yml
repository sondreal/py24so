name: Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Update version if manually triggered
      if: github.event_name == 'workflow_dispatch'
      run: |
        # The version is single-sourced from py24so/_version.py
        sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${{ github.event.inputs.version }}\"/" py24so/_version.py
        # Create a tag for this version
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add py24so/_version.py
        git commit -m "Bump version to ${{ github.event.inputs.version }}"
        git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
        git push origin "v${{ github.event.inputs.version }}"
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package
      run: |
        python -m twine check dist/*
        
    - name: Test with pytest
      run: |
        pip install .[dev]
        pytest tests/unit
        
    - name: Publish to PyPI
      if: success()
      uses: pypa/gh-action-pypi-publish@release/v1

# Publishing uses PyPI trusted publishing (the `id-token: write` permission above);
# no API token secret is needed once the project is configured on PyPI. 