name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Format, types and generated code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Check formatting with Black
      run: black --check py24so tests scripts examples

    - name: Check imports with isort
      run: isort --check py24so tests scripts examples

    - name: Type check with mypy (strict)
      run: mypy

    - name: Check generated sync resources are up to date
      run: python scripts/unasync.py --check

    - name: Format suggestion
      if: failure()
      run: |
        echo "::warning::Run 'make format' (and 'python scripts/unasync.py' after editing py24so/resources/_async) locally."

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests
      run: pytest tests/unit

  test-minimum-versions:
    name: Test with minimum supported httpx and pydantic
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev] "httpx==0.26.0" "pydantic==2.5.0"

    - name: Run tests
      run: pytest tests/unit

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests with coverage
      run: pytest --cov=py24so --cov-report=xml tests/unit

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
      continue-on-error: true
