[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py24so"
dynamic = ["version"]
description = "Typed, sync + async Python client for the 24SevenOffice (Finago Office) REST API"
authors = [
    {name = "Sondre Dyrnes", email = "sondre@villdyr.no"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["24sevenoffice", "24so", "finago", "erp", "accounting", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.26.0,<1",
    "pydantic>=2.5.0,<3",
]

[project.optional-dependencies]
http2 = ["httpx[http2]>=0.26.0,<1"]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/sondreal/py24so"
"API reference" = "https://rest.api.24sevenoffice.com/v1/openapi.json"
"Developer portal" = "https://developer.24sevenoffice.com/"

[tool.setuptools.dynamic]
version = {attr = "py24so._version.__version__"}

[tool.setuptools.packages.find]
include = ["py24so*"]

[tool.setuptools.package-data]
py24so = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
packages = ["py24so"]
strict = true
plugins = ["pydantic.mypy"]
